<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json">
    <title>AI Tutor</title>
    <style>
      /* Simple CSS directly in HTML to save file juggling */
      body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; background: #f0f2f5; }
      header { background: #fff; padding: 15px; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
      h1 { margin: 0; font-size: 1.2rem; }
      #status-bar { background: #fff3cd; color: #856404; text-align: center; padding: 8px; font-size: 0.9rem; display: none; }
      #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
      .message { max-width: 80%; padding: 10px 15px; border-radius: 15px; line-height: 1.4; }
      .user { align-self: flex-end; background: #007bff; color: white; border-bottom-right-radius: 2px; }
      .ai { align-self: flex-start; background: white; border: 1px solid #ddd; border-bottom-left-radius: 2px; }
      .controls { background: white; padding: 15px; border-top: 1px solid #ccc; display: flex; gap: 10px; }
      textarea { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; resize: none; height: 24px; }
      button { border: none; cursor: pointer; border-radius: 20px; font-weight: bold; }
      #send-btn { background: #28a745; color: white; padding: 0 20px; }
      #send-btn:disabled { background: #ccc; }
      #clear-btn { background: #eee; padding: 0 15px; }
      #install-btn { background: #007bff; color: white; padding: 8px 12px; font-size: 0.8rem; display: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>🎓 Chromebook Tutor</h1>
        <button id="install-btn">⬇ Install</button>
      </header>
      <div id="status-bar">Initializing...</div>
      <div id="chat-container"></div>
      <div class="controls">
        <button id="clear-btn">🧹</button>
        <textarea id="user-input" placeholder="Type a question..."></textarea>
        <button id="send-btn">Send</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
