<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json">
    <title>AI Tutor</title>
    <style>
      body { font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; background: #f0f2f5; }
      header { background: #fff; padding: 15px; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
      h1 { margin: 0; font-size: 1.2rem; }
      
      /* Progress Bar Styles */
      #progress-container { background: #fff; padding: 20px; text-align: center; border-bottom: 1px solid #ccc; display: none; }
      progress { width: 100%; height: 20px; border-radius: 10px; }
      #status-text { display: block; margin-bottom: 5px; color: #555; font-size: 0.9rem; }

      #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
      .message { max-width: 80%; padding: 12px 16px; border-radius: 18px; line-height: 1.5; word-wrap: break-word; }
      .user { align-self: flex-end; background: #007bff; color: white; border-bottom-right-radius: 4px; }
      .ai { align-self: flex-start; background: white; border: 1px solid #ddd; border-bottom-left-radius: 4px; }
      
      .controls { background: white; padding: 15px; border-top: 1px solid #ccc; display: flex; gap: 10px; }
      textarea { flex: 1; padding: 12px; border-radius: 24px; border: 1px solid #ccc; resize: none; height: 24px; outline: none; }
      textarea:focus { border-color: #007bff; }
      button { border: none; cursor: pointer; border-radius: 20px; font-weight: bold; transition: opacity 0.2s; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      #send-btn { background: #28a745; color: white; padding: 0 20px; }
      #clear-btn { background: #e9ecef; padding: 0 15px; }
      #install-btn { background: #007bff; color: white; padding: 8px 12px; font-size: 0.8rem; display: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>🎓 Chromebook Tutor</h1>
        <button id="install-btn">⬇ Install App</button>
      </header>

      <div id="progress-container">
        <span id="status-text">Initializing...</span>
        <progress id="dl-bar" value="0" max="100"></progress>
      </div>
      
      <div id="chat-container"></div>

      <div class="controls">
        <button id="clear-btn" title="Clear Chat">🧹</button>
        <textarea id="user-input" placeholder="Type a question..."></textarea>
        <button id="send-btn">Send</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
